# Checks the trigger functions' logic against a stand-in Atlas context, the IAM policy,
# and the DuckDB query. Atlas and S3 themselves need accounts CI doesn't have.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Functions parse and do what the tutorial says
        run: |
          node --check functions/create-event-every-min.js
          node --check functions/copy-events-to-s3.js
          node --test test/functions.test.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: The DuckDB check query runs
        run: |
          pip install duckdb
          python test/verify_sql.py
